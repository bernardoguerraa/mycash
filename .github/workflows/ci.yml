name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Node 22 nos tres jobs, igual ao que se usa no desenvolvimento.
# Com Node 20 o job de integracao quebrava em
# `webidl.util.markAsUncloneable is not a function`: o undici que vem junto do
# testcontainers usa uma API que so existe a partir do Node 22. O sintoma era
# enganoso — o Vitest morria ao carregar o globalSetup e reportava
# "No test files found", como se o problema fosse o padrao de inclusao.
#
# Tres jobs em paralelo. Web e mobile ficam separados porque tem arvores de
# dependencias incompativeis (React 18.3.1 no Next, 19.1.0 no Expo) e cada um
# instala as suas. A integracao e separada por custo: sobe um container
# PostgreSQL, entao nao faz sentido segurar o feedback de lint e unidade
# esperando por ela.
jobs:
  web:
    name: Web (typecheck, lint, testes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run ESLint (espelha o lint que o Vercel executa no build)
        run: npm run lint

      # `--coverage` no lugar de `npm test` cru: o mesmo comando roda a suite e
      # aplica os limites de cobertura declarados em vitest.config.ts. Ficar
      # abaixo do limite reprova o job, entao a cobertura e verificada a cada
      # push em vez de ser um numero que alguem olha de vez em quando.
      - name: Run tests with coverage (Vitest)
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-dominio
          path: coverage/
          retention-days: 14

  mobile:
    name: Mobile (typecheck, lint, testes)
    runs-on: ubuntu-latest
    steps:
      # O app importa a camada de dominio de ../src/domain, entao o checkout
      # precisa do repositorio inteiro — nao daria para clonar so mobile/.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: mobile
        run: npm run lint

      - name: Run tests (Vitest)
        working-directory: mobile
        run: npm test

  integracao:
    name: Integração (Testcontainers + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Baixar a imagem num passo proprio, e nao dentro do teste. Se o
      # download falhar (o Docker Hub limita por IP, e os runners compartilham
      # IP), o erro aparece aqui em vez de virar um timeout confuso na suite.
      - name: Pull PostgreSQL image
        run: docker pull postgres:17-alpine

      # O runner do GitHub Actions ja traz Docker instalado e rodando, entao
      # o Testcontainers sobe o PostgreSQL sem passo extra. Nao usamos
      # `services:` de proposito: o container tem de ser provisionado pelo
      # proprio teste, que e o que o Testcontainers garante — o mesmo codigo
      # roda igual aqui e na maquina de quem desenvolve.
      - name: Run integration tests
        run: npm run test:integracao
        env:
          # Ryuk e o container que o Testcontainers usa para faxina apos a
          # suite. No runner isso e desnecessario — a maquina inteira e
          # descartada ao fim do job — e o sidecar e uma peca a mais que pode
          # nao subir.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          # O runner tem 2 nucleos; 4 forks disputariam CPU com o proprio
          # Postgres do container.
          VITEST_MAX_WORKERS: '2'
